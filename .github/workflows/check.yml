name: Offline regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/SnapshotPayloadChecks
      - run: dotnet run --project tests/WorkspaceChecks
      - run: dotnet run --project tests/WorkspaceAdapterChecks
      - run: dotnet run --project tests/SnapshotStartupChecks
